<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roulette Tracker - v1.76.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Fixed Top Section: Keypad + History */
    .top-fixed { background: #1e293b; padding: 8px; border-bottom: 2px solid #334155; shrink: 0; }
    .history-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; align-items: center; }
    .history-title { font-size: 0.75rem; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-right: 4px; }
    .chip { min-width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; color: #fff; flex-shrink: 0; }
    .chip-red { background: #991b1b; }
    .chip-black { background: #151c24; border: 1px solid #475569; }
    .chip-green { background: #15803d; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .keypad button { background: #151c24; border: 1px solid #334155; color: #fff; font-size: 1.1rem; font-weight: bold; padding: 12px 0; border-radius: 6px; cursor: pointer; }
    .keypad button:active { background: #3b82f6; }
    .keypad .btn-action { background: #334155; color: #38bdf8; }
    .keypad .btn-enter { background: #16a34a; color: #fff; grid-column: span 2; }
    .keypad .btn-high { background: #475569; color: #f8fafc; }
    .keypad .btn-high.active { background: #2563eb; color: #fff; }

    /* Main Scrollable Content */
    .scroll-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    
    .card { background: #1e293b; border-radius: 8px; padding: 10px; border: 1px solid #334155; }
    .card-title { font-size: 0.8rem; font-weight: bold; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; display: flex; justify-content: space-between; }
    
    /* Quadrants Bar */
    .quad-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
    .quad-box { background: #0f172a; padding: 8px 4px; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
    .quad-label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
    .quad-val { font-size: 0.95rem; font-weight: bold; margin-top: 2px; }
    
    /* Dynamic Colors */
    .alert-yellow { color: #f59e0b; border-color: #f59e0b; }
    .alert-green { color: #22c55e; border-color: #22c55e; }
    .glow-cyan { border-color: #06b6d4; box-shadow: 0 0 8px #06b6d4; }

    .numbers-panel { margin-top: 8px; padding: 8px; background: #0f172a; border-radius: 6px; font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-align: center; display: none; }

    .stat-line { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #334155; }
    .stat-line:last-child { border-bottom: none; }
    .strat-val { font-weight: bold; }

    .controls-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .input-field { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 6px; font-size: 0.9rem; width: 100%; }
    .action-row { display: flex; gap: 6px; }
    .action-row button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; font-size: 0.8rem; }
    .btn-reset { background: #ef4444; }
    .btn-copy { background: #2563eb; }
    .btn-dl { background: #16a34a; }
  </style>
</head>
<body>

  <div class="top-fixed">
    <div class="history-bar">
      <span class="history-title">LAST:</span>
      <div id="history-chips" style="display:flex; gap:6px;"></div>
    </div>

    <div class="keypad">
      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button onclick="pressKey('00')" class="btn-action" id="btn-00">00</button>
      <button onclick="pressKey('0')" class="btn-action" id="btn-0">0</button>
      <button onclick="toggleHighMode()" class="btn-high" id="btn-high">HIGH</button>
      <button onclick="clearInput()" class="btn-action">C</button>
      <button onclick="submitSpin()" class="btn-enter">ENTER <span id="input-buffer"></span></button>
    </div>
  </div>

  <div class="scroll-container">

    <div class="card">
      <div class="card-title">
        <span>Junko Quadrants (W=15)</span>
        <span id="green-dryness" style="color:#94a3b8;">0/00: 0 (0+)</span>
      </div>
      <div class="quad-grid">
        <div class="quad-box" id="box-GN" onclick="toggleQuadNums('GN')">
          <div class="quad-label">GN</div>
          <div class="quad-val" id="val-GN">0 (0+)</div>
        </div>
        <div class="quad-box" id="box-HO" onclick="toggleQuadNums('HO')">
          <div class="quad-label">HO</div>
          <div class="quad-val" id="val-HO">0 (0+)</div>
        </div>
        <div class="quad-box" id="box-LO" onclick="toggleQuadNums('LO')">
          <div class="quad-label">LO</div>
          <div class="quad-val" id="val-LO">0 (0+)</div>
        </div>
        <div class="quad-box" id="box-M" onclick="toggleQuadNums('M')">
          <div class="quad-label">M</div>
          <div class="quad-val" id="val-M">0 (0+)</div>
        </div>
      </div>
      <div id="quad-numbers-panel" class="numbers-panel"></div>
    </div>

    <div class="card">
      <div class="card-title">Streets of Fire (0,00,1,2,3,34,35,36)</div>
      <div class="stat-line">
        <span>Window Activity:</span>
        <span id="stat-sof" class="strat-val">0 hits in last 15 | Age: 0+</span>
      </div>
    </div>

    <div class="card controls-group">
      <input type="text" id="casino-name" class="input-field" placeholder="Casino Name" value="Live Casino">
      <div class="action-row">
        <button class="btn-reset" onclick="resetData()">Reset</button>
        <button class="btn-copy" onclick="copyCSV()">Copy CSV</button>
        <button class="btn-dl" onclick="downloadCSV()">Download</button>
      </div>
    </div>

  </div>

  <script>
    // System Constants
    const RED_NUMS = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36];
    const GREEN_NUMS = ['0', '00'];

    const QUADRANTS = {
      GN: ["0", "00", "1", "2", "9", "10", "13", "14", "27", "28"],
      M:  ["5", "6", "7", "8", "17", "18", "19", "20", "31", "32"],
      LO: ["3", "4", "11", "12", "15", "16", "21", "22", "23", "24"],
      HO: ["23", "24", "25", "26", "29", "30", "33", "34", "35", "36"]
    };

    const SOF_NUMBERS = ["0", "00", "1", "2", "3", "34", "35", "36"];

    let spins = [];
    let currentInput = "";
    let isHighMode = false;
    let activeQuadPanel = null;

    function pressKey(val) {
      if (currentInput.length < 2) {
        currentInput += val;
        document.getElementById('input-buffer').innerText = `(${currentInput})`;
      }
    }

    function clearInput() {
      currentInput = "";
      document.getElementById('input-buffer').innerText = "";
    }

    function toggleHighMode() {
      isHighMode = !isHighMode;
      document.getElementById('btn-high').classList.toggle('active', isHighMode);
    }

    function submitSpin() {
      if (!currentInput) return;
      
      if (isHighMode) {
        // Track high score mode if toggled
        clearInput();
        toggleHighMode();
        return;
      }

      spins.unshift({ number: currentInput, timestamp: new Date() });
      clearInput();
      updateUI();
    }

    function toggleQuadNums(key) {
      const panel = document.getElementById('quad-numbers-panel');
      if (activeQuadPanel === key) {
        panel.style.display = 'none';
        activeQuadPanel = null;
      } else {
        panel.innerText = `${key} Numbers: ${QUADRANTS[key].join(', ')}`;
        panel.style.display = 'block';
        activeQuadPanel = key;
      }
    }

    function updateUI() {
      // 1. History Chips
      const chipContainer = document.getElementById('history-chips');
      chipContainer.innerHTML = '';
      spins.slice(0, 10).forEach(s => {
        const chip = document.createElement('div');
        const num = s.number;
        let colorClass = 'chip-black';
        if (GREEN_NUMS.includes(num)) colorClass = 'chip-green';
        else if (RED_NUMS.includes(parseInt(num))) colorClass = 'chip-red';

        chip.className = `chip ${colorClass}`;
        chip.innerText = num;
        chipContainer.appendChild(chip);
      });

      // 2. Junko Quadrants (Window 15)
      const window15 = spins.slice(0, 15).map(s => s.number);
      Object.keys(QUADRANTS).forEach(key => {
        const count = window15.filter(n => QUADRANTS[key].includes(n)).length;
        let age = 0;
        for (let i = 0; i < spins.length; i++) {
          if (QUADRANTS[key].includes(spins[i].number)) break;
          age++;
        }

        const valEl = document.getElementById(`val-${key}`);
        const boxEl = document.getElementById(`box-${key}`);
        valEl.innerText = `${count} (${age}+)`;

        boxEl.className = "quad-box";
        if (age >= 9) boxEl.classList.add("alert-green");
        else if (age >= 5) boxEl.classList.add("alert-yellow");
      });

      // 3. Green (0/00) Dryness Alert
      let grAge = 0;
      for (let i = 0; i < spins.length; i++) {
        if (GREEN_NUMS.includes(spins[i].number)) break;
        grAge++;
      }
      const grEl = document.getElementById('green-dryness');
      const grCount = window15.filter(n => GREEN_NUMS.includes(n)).length;
      grEl.innerText = `0/00: ${grCount} (${grAge}+)`;
      
      document.getElementById('btn-0').classList.toggle('glow-cyan', grAge >= 15);
      document.getElementById('btn-00').classList.toggle('glow-cyan', grAge >= 15);

      // 4. Streets of Fire Monitor
      const sofCount = window15.filter(n => SOF_NUMBERS.includes(n)).length;
      let sofAge = 0;
      for (let i = 0; i < spins.length; i++) {
        if (SOF_NUMBERS.includes(spins[i].number)) break;
        sofAge++;
      }
      const sofEl = document.getElementById('stat-sof');
      sofEl.innerText = `${sofCount} hits in last 15 | Age: ${sofAge}+`;
      sofEl.className = "strat-val";
      if (sofCount >= 6 || sofAge >= 8) sofEl.classList.add("alert-green");
      else if (sofCount === 5 || (sofAge >= 5 && sofAge <= 7)) sofEl.classList.add("alert-yellow");
    }

    function resetData() {
      if (confirm("Reset current session data?")) {
        spins = [];
        updateUI();
      }
    }

    function copyCSV() {
      const csv = spins.map(s => s.number).join(',');
      navigator.clipboard.writeText(csv);
      alert("CSV copied to clipboard!");
    }

    function downloadCSV() {
      const csv = "Spin\n" + spins.map(s => s.number).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `roulette_session_${Date.now()}.csv`;
      a.click();
    }
  </script>
</body>
</html>
